const LP=(e,r)=>{if(!e.lp||e.lp==.5)return r.m;try{const q=document.createElementNS('http://www.w3.org/2000/svg','path');q.setAttribute('d',r.d);const t=q.getPointAtLength(q.getTotalLength()*e.lp);return[t.x,t.y]}catch(_){return r.m}};
const rnd=(r,cr)=>{if(/[CQSAZ]/i.test(r.d.replace(/^M/,'')))return r;const P_=[...r.d.matchAll(/[ML]\s*(-?[\d.]+)[ ,]+(-?[\d.]+)/g)].map(m=>[+m[1],+m[2]]);if(P_.length<3)return r;let d='M'+P_[0];for(let i=1;i<P_.length-1;i++){const a=P_[i-1],b=P_[i],c=P_[i+1],l1=Math.hypot(b[0]-a[0],b[1]-a[1]),l2=Math.hypot(c[0]-b[0],c[1]-b[1]),k=Math.min(cr,l1/2,l2/2);if(!k){d+=' L'+b;continue}const p1=[b[0]+(a[0]-b[0])/l1*k,b[1]+(a[1]-b[1])/l1*k],p2=[b[0]+(c[0]-b[0])/l2*k,b[1]+(c[1]-b[1])/l2*k];d+=` L${p1} Q${b} ${p2}`}return{d:d+' L'+P_[P_.length-1],m:r.m}};

function agendaDlg(){const td=new Date().toISOString().slice(0,10),w=new Date(Date.now()+6048e5).toISOString().slice(0,10),A=[];S.projects.forEach(p=>Object.values(p.items).forEach(i=>{if(!i.fr&&i.dl&&i.st!=='ok')A.push({p,i})}));A.sort((a,b)=>a.i.dl<b.i.dl?-1:1);const g=[['Просрочено','#dc2626',A.filter(x=>x.i.dl<td)],['Сегодня','#2563eb',A.filter(x=>x.i.dl===td)],['Ближайшие 7 дней','#16a34a',A.filter(x=>x.i.dl>td&&x.i.dl<=w)]],D=x=>x.slice(8)+'.'+x.slice(5,7);dlg(`<h3>Сроки по всем проектам</h3>${g.map(([h,c,l])=>l.length?`<p class="sec" style="color:${c}">${h} · ${l.length}</p>${l.slice(0,30).map(x=>`<button class="b" style="width:100%;justify-content:flex-start;margin:0 0 4px;text-align:left;height:auto;min-height:44px;padding:8px 12px" data-ap="${x.p.id}" data-ai="${x.i.id}"><b style="min-width:48px">${D(x.i.dl)}</b><span>${esc(x.i.t.split('\n')[0])} <small class="mu">· ${esc(x.p.name)}</small></span></button>`).join('')}`:'').join('')||'<p class="mu">Ближайших сроков нет</p>'}`);$('.box').onclick=e=>{const b=e.target.closest('[data-ap]');if(!b)return;cls();openProj(b.dataset.ap);setTimeout(()=>{try{jump(b.dataset.ai)}catch(_){}},200)}}
$('#hd').onclick=agendaDlg;

function nextDlg(){const nm=P.name+' — следующий период';dlg(`<h3>Копия на следующий период</h3><p class="mu" style="margin:0 0 8px">Создаст копию проекта со сдвигом сроков. Подходит для повторяющейся работы по клиенту.</p><label>Название</label><input id="nn" value="${esc(nm)}"><label>Сдвинуть сроки на, дней</label><input id="nd" type="number" value="30"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="nr" checked style="width:auto"> Сбросить статусы блоков</label><div class="row"><button class="b pri" id="ng">Создать копию</button><button class="b" id="nx">Закрыть</button></div>`);$('#nx').onclick=cls;$('#ng').onclick=()=>{const n=parseInt($('#nd').value)||0,r=$('#nr').checked,c=cp(P),sh=(d)=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};c.id=uid();c.name=$('#nn').value.trim()||nm;c.ts=Date.now();c.fav=0;c.hist=[];c.view=null;delete c.ov;Object.values(c.items).forEach(i=>{if(i.dl)i.dl=sh(i.dl);if(i.sd)i.sd=sh(i.sd);if(r&&!i.fr)i.st=''});S.projects.push(c);save();cls();openProj(c.id);toast('Копия создана')}}

{const h0=home;home=function(){h0.apply(this,arguments);try{const td=new Date().toISOString().slice(0,10);let n=0;S.projects.forEach(p=>Object.values(p.items).forEach(i=>{if(!i.fr&&i.dl&&i.dl<=td&&i.st!=='ok')n++}));$('#hd').textContent='📅 Сроки по всем проектам'+(n?' · горит: '+n:'')}catch(_){}}}
